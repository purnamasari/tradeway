name: Deploy

# CI/CD for the VPS. On every push to main: gate on typecheck, then SSH in and run
# the idempotent deploy (git pull → install → migrate → pm2 reload → health gate).
# Concurrency guard cancels superseded runs so two pushes can't deploy at once.
on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual "Run workflow" deploys from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Fail the step if any command fails. The action runs a NON-interactive,
          # non-login shell, where ~/.bashrc typically early-returns before its PATH
          # setup — so sourcing it doesn't expose pnpm/node/pm2. Rebuild PATH from the
          # usual install locations (nvm, pnpm standalone, corepack, npm-global) here,
          # before deploy.sh, so the very first run after this change already works.
          script_stop: true
          script: |
            set -e
            # SSH doesn't inherit the runner's CI var; pnpm needs it to run
            # non-interactively (e.g. to wipe/reinstall node_modules without a TTY).
            export CI=true
            export PNPM_HOME="${PNPM_HOME:-$HOME/.local/share/pnpm}"
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1 || true
            export PATH="$PNPM_HOME:$HOME/.npm-global/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
            command -v corepack >/dev/null 2>&1 && corepack enable >/dev/null 2>&1 || true
            cd "${{ secrets.VPS_APP_DIR }}"
            # Refresh the repo (including deploy.sh itself) BEFORE invoking it. This
            # step lives in the workflow, which GitHub always reads fresh from main,
            # so changes to deploy.sh's own steps take effect on THIS run instead of
            # one run late (the on-disk script can't update the steps it's mid-way
            # through executing).
            git fetch --prune origin main
            git reset --hard origin/main
            ./scripts/deploy.sh
