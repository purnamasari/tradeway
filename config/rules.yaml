# config/rules.yaml — scoring weights, regime thresholds, retention.

regime:
  adx_period: 14
  ema_fast: 20
  ema_slow: 50
  atr_period: 14
  trending_adx: 25         # ADX >= this => trend strength present
  ranging_adx: 18          # ADX <= this => no trend
  ema_spread_flat: 0.001   # |ema20-ema50|/ema50 below this => flat
  high_vol_atr_pct: 80     # ATR percentile >= this => high volatility
  low_vol_atr_pct: 20      # ATR percentile <= this => low volatility

trend:
  confidence_floor: 40     # below this, fall back to next tier
  flash_timeout_ms: 5000
  flash_lite_timeout_ms: 3000

# Confidence = market-conditions score (0-100).
confidence_weights:
  funding_percentile: 35
  oi_zscore: 30
  volume_percentile: 25
  regime_alignment: 10

# Setup quality = technical-structure score (0-100), all formula-based.
setup_quality_weights:
  sr_level_strength: 30
  engulf_body_ratio: 25
  htf_aligned: 20
  sweep_wick_ratio: 15
  structure_intact: 10

# Active signal lifecycle: edge re-evaluation thresholds (every-minute monitor).
lifecycle:
  weakening_confidence_drop: 20    # original − live confidence >= this => EDGE_WEAKENING
  invalidate_confidence_floor: 35  # live confidence at/below => INVALIDATED (critical, alone)
  invalidate_min_failures: 2       # # of soft failures (trend/regime/structure/drop) for INVALIDATED
  invalidate_grace_min: 5          # never INVALIDATED within this many minutes of signal creation
  require_follow: true             # Telegram: track a signal only after Follow is pressed (console always auto-tracks)
  update_confidence_delta: 15      # send Telegram update if live conf moved >= this since last
  update_min_interval_min: 10      # min minutes between non-state-change updates
  edge_history_min_delta: 3        # append signal_edge_updates row when live conf moves >= this
  edge_history_min_interval_min: 5 # ...or at least this often (heartbeat), to bound row growth

# Active-trade management: the 1-minute manager re-scans every filled trade and
# suggests actions (move SL, take partials, exit) until the trade closes. The bot
# never executes — every output is a suggestion for the trader.
management:
  enabled: true
  # Plan triggers (R multiples of initial risk).
  breakeven_at_r: 1.0            # at +1R → suggest moving SL to breakeven
  lock_at_r: 1.5                 # at +1.5R → suggest locking partial profit
  lock_fraction: 0.30            # fraction locked at lock_at_r
  resistance_partial_fraction: 0.25  # partial when volume weakens near TP/resistance
  # Rejection detection (1m candles).
  rejection_window: 10           # 1m candles inspected
  rejection_wicks_min: 3         # rejection wicks within window => signal
  rejection_wick_body: 1.5       # wick >= this x body counts as a rejection wick
  volume_decline_pct: 30         # directional volume down >= this % half-over-half
  body_weakening_pct: 40         # avg candle body shrink >= this %
  # Momentum decay (15m candles).
  decay_vol_contraction: 0.7     # recent/prior volume ratio below this => contraction
  decay_atr_contraction: 0.8     # ATR now vs lookback-ago below this => contraction
  decay_adx_drop: 5              # ADX points lost vs lookback => decline
  decay_lookback: 10             # 15m bars for ATR/ADX comparisons
  # Adaptive stop suggestions (method chosen by regime: trending=swing,
  # high_volatility=ATR, ranging=structure, low_volatility=EMA).
  trail_atr_mult: 2.0
  trail_ema_period: 21
  stop_buffer_pct: 0.15          # buffer beyond structure/swing levels (% of price)
  min_stop_improve_r: 0.1        # suggest only if >= this much initial risk is removed
  # Trade health weights (sum 100).
  health_weights:
    structure: 25
    momentum: 25
    volume: 15
    trend_alignment: 15
    risk_protection: 20
  # Alerting & persistence throttles.
  health_alert_drop: 15          # alert when health falls >= this since last alert
  update_min_interval_min: 10    # min minutes between routine in-place report edits
  event_cooldown_min: 45         # per event-kind cooldown for warning alerts
  emergency_confidence_floor: 45 # live confidence below this => emergency exit condition
  history_min_interval_min: 10   # health history heartbeat cadence
  history_min_health_delta: 5    # ...or when health moved >= this

# Outcome & edge analytics surfaces (CLI report, Telegram digest, HTTP endpoint).
analytics:
  default_window_days: 30    # CLI/HTTP default lookback (0 = all-time)
  digest_every_hours: 168    # scheduled Telegram digest cadence (weekly); 0 disables
  digest_window_days: 7      # window the digest summarizes

retention:
  metric_history_days: 180
  regime_log_days: 90
  edge_updates_days: 90
  management_events_days: 90

squeeze:
  enabled: false           # disabled pending evidence — was a consistent loser (counter-trend fade)
  funding_extreme_low: 10
  funding_extreme_high: 90
  oi_zscore_min: 1.0
  oi_zscore_max: -1.0

# Stop-loss sizing. Structural stops are widened to ATR so they aren't inside the
# noise (a flat 0.5% stop in a high-volatility regime gets run over instantly).
risk:
  atr_sl_mult: 1.5         # stop distance >= this * ATR(15m)
  min_sl_pct: 0.4          # floor on stop distance (% of price)
  max_sl_pct: 5.0          # cap on stop distance (% of price)

# Momentum / breakout detector — rides a fast directional move instead of fading it.
momentum:
  enabled: true
  lookback_1m: 7           # window of 1m candles to measure the move
  min_move_pct: 1.5        # |move| over the window to qualify (percent)
  vol_mult: 1.2            # latest volume >= this * window-average volume
  tp_r: 2.5                # take-profit R-multiple when no S/R target is in range
  max_final_candle_frac: 0.7  # reject blow-off bars (>70% of the move in one candle)

# One-time historical backfill from Bybit. Bootstraps percentile/z-score windows
# so adaptive thresholds are meaningful immediately after deploy.
backfill:
  funding_days: 90        # funding-rate history window
  oi_days: 90             # open-interest history window
  candle_days: 90         # 15m candle storage window (research + consistency)
  # Recent window (days) used at scan time to compute ATR percentile (regime
  # classification) and volume percentile from the stored candles. Kept shorter
  # than candle_days so the volatility regime stays reactive even though 90d of
  # raw candles are retained.
  percentile_days: 30
  oi_interval: "1h"       # Bybit intervalTime for OI snapshots
  # Minimum samples below which a symbol is considered to lack historical context
  # and is (re)backfilled at startup.
  min_funding: 50
  min_oi: 30
  min_volume: 50
  min_candles: 50


# Strategy-agnostic execution engine (src/engine/ — MIGRATION_PLAN.md Phase 2).
# Runs alongside the legacy signal path; engine positions are source='engine'.
# Available strategies: H18 (validated trend breakout — research/output/
# H18_validation.md) and SMC (liquidity-sweep reversal scalp/daytrade —
# research/output/SMC_validation.md). They are regime-complements (H18 skips
# ranging; SMC trades ONLY ranging/high_volatility) and hold independent
# (symbol, strategy) slots, so both can be enabled together.
engine:
  enabled: true
  strategies: [H18, SMC]            # SMC_SCALP parked backtest-only — no scalp edge at 15m, see research/output/SMC_SCALP_findings.md. Empty list = idle cycle
  risk_model: fixed_fraction      # advisory | fixed_fraction | fixed_notional | vol_target
  equity: 1000             # paper equity for sizing (quote currency)
  risk_fraction: 0.01       # fixed_fraction: equity fraction risked per trade
  notional: 1000            # fixed_notional: quote amount per position
  target_daily_vol: 0.01    # vol_target: per-day vol contribution target
  max_open_positions: 0     # 0 = unlimited
