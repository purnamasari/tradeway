# config/rules.yaml — scoring weights, regime thresholds, retention.

regime:
  adx_period: 14
  ema_fast: 20
  ema_slow: 50
  atr_period: 14
  trending_adx: 25         # ADX >= this => trend strength present
  ranging_adx: 18          # ADX <= this => no trend
  ema_spread_flat: 0.001   # |ema20-ema50|/ema50 below this => flat
  high_vol_atr_pct: 80     # ATR percentile >= this => high volatility
  low_vol_atr_pct: 20      # ATR percentile <= this => low volatility

trend:
  confidence_floor: 40     # below this, fall back to next tier
  flash_timeout_ms: 5000
  flash_lite_timeout_ms: 3000

# Confidence = market-conditions score (0-100).
confidence_weights:
  funding_percentile: 35
  oi_zscore: 30
  volume_percentile: 25
  regime_alignment: 10

# Setup quality = technical-structure score (0-100), all formula-based.
setup_quality_weights:
  sr_level_strength: 30
  engulf_body_ratio: 25
  htf_aligned: 20
  sweep_wick_ratio: 15
  structure_intact: 10

retention:
  metric_history_days: 180
  regime_log_days: 90

squeeze:
  funding_extreme_low: 10
  funding_extreme_high: 90
  oi_zscore_min: 1.0
  oi_zscore_max: -1.0

# One-time historical backfill from Bybit. Bootstraps percentile/z-score windows
# so adaptive thresholds are meaningful immediately after deploy.
backfill:
  funding_days: 90        # funding-rate history window
  oi_days: 90             # open-interest history window
  candle_days: 90         # 15m candle storage window (research + consistency)
  # Recent window (days) used at scan time to compute ATR percentile (regime
  # classification) and volume percentile from the stored candles. Kept shorter
  # than candle_days so the volatility regime stays reactive even though 90d of
  # raw candles are retained.
  percentile_days: 30
  oi_interval: "1h"       # Bybit intervalTime for OI snapshots
  # Minimum samples below which a symbol is considered to lack historical context
  # and is (re)backfilled at startup.
  min_funding: 50
  min_oi: 30
  min_volume: 50
  min_candles: 50

